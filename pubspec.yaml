name: tbb
description: "tbb_project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Firebase
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.4

  # State management
  flutter_riverpod: ^2.6.1

  # Fotoğraf işlemleri
  image_picker: ^1.1.2

  # Cloudinary (fotoğraf depolama)
  http: ^1.2.2

  # Konum / mahalle seçimi
  geolocator: ^14.0.3
  geocoding: 5.0.0

  # Yerel veri saklama (giriş bilgisi, oturum)
  shared_preferences: ^2.3.3

  # Şifre/PIN hash'leme
  crypto: ^3.0.6

  # UI yardımcıları
  intl: ^0.19.0

  # Yerel splash ekranı
  flutter_native_splash: ^2.4.4
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.14.3

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash/tbb_logo_transparent.png
    - assets/splash/tbb_splash_logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/tbb_splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/splash/tbb_splash_logo.png
    icon_background_color: "#FFFFFF"
    

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/splash/icon_main.png"
 